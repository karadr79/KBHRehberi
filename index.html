/* Layout: sabit sol gezinme (masaüstü) + çekmece (mobil); içerik sütunu 760px okuma genişliği, hesaplayıcılar kart içinde */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eef2f7; --ink:#14202e; --muted:#5a6878; --line:#d8dfe8;
  --accent:#1f5f99; --accent-ink:#ffffff; --accent-soft:#e3edf8; --nav:#16324f; --nav-ink:#dbe6f2; --nav-dim:#8fa6bf;
  --draft:#a5600d; --draft-soft:#fbefdc; --pp:#5d6b7a; --pp-soft:#eceff3;
  --ok:#2f7d4f; --warn:#b07a12; --bad:#b4372b;
  --h-green:#5fae6e; --h-yellow:#e7c94c; --h-orange:#e58a3a; --h-red:#cf4a3c; --h-deep:#8e2620;
  --font-body: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

}

:root[data-theme="dark"]{

*{box-sizing:border-box}

a{color:var(--accent)}

.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100%}

.brand svg{flex:none}

.brand small{color:var(--nav-dim);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.search{position:relative}

.top{display:none}

main{min-width:0;padding-block:34px 80px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.eyebrow{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow .src{font-family:var(--font-mono);letter-spacing:0;text-transform:none;background:var(--surface2);border:1px solid var(--line);padding:2px 8px;border-radius:5px;color:var(--ink)}

p.txt{margin:0;max-width:70ch}

.rec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.rec .tag{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:54px}
.grade{font-family:var(--font-mono);font-weight:700;font-size:.82rem;border-radius:5px;padding:2px 7px;text-align:center;min-width:40px}
.g1{background:var(--accent);color:var(--accent-ink)}
.g2{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.gpp{background:var(--pp-soft);color:var(--pp);border:1px solid var(--line)}
.gng{background:var(--pp-soft);color:var(--pp);border:1px dashed var(--pp)}
.num{font-family:var(--font-mono);font-size:.7rem;color:var(--muted)}
.rec .body{min-width:0}
.rec.draft{background:var(--draft-soft);border-color:var(--draft)}
.rec.draft .grade.g1{background:var(--draft);color:var(--surface)}
.rec.draft .grade.g2{background:transparent;color:var(--draft);border-color:var(--draft)}
.rec .kind{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.rec.draft .kind{color:var(--draft);font-weight:700}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;max-width:72ch}
.note.warn{border-color:var(--draft);background:var(--draft-soft)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-weight:600;font-size:.82rem}
tr:last-child td{border-bottom:0}
td.n,th.n{font-variant-numeric:tabular-nums}
.cap{font-size:.8rem;color:var(--muted);margin:-4px 0 0}
/* Calculator */
.calc{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.calc>header{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.calc>header b{font-size:1rem}
.calc>header span{font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
.calc .cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:.78rem;color:var(--muted);font-weight:600}
.f input,.f select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;font-variant-numeric:tabular-nums}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.chk input{margin-top:4px}
.chks{display:flex;flex-direction:column;gap:6px}
.out{border-radius:8px;background:var(--bg);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.big{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline}
.big .v{font-family:var(--font-head);font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.big .u{color:var(--muted);font-size:.85rem}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.kv small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.kv strong{font-variant-numeric:tabular-nums;font-size:1.05rem}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.info{color:var(--accent)}
.msg{margin:0;font-size:.92rem}
.msg.dim{color:var(--muted);font-size:.82rem}
/* heat map */
.heat{display:grid;grid-template-columns:88px repeat(3,minmax(0,1fr));gap:3px;font-size:.8rem;min-width:420px}
.heat div{padding:7px 6px;border-radius:4px;text-align:center}
.heat .hh{background:var(--surface2);font-weight:600}
.heat .c{color:#1b1b1b;font-weight:700;font-variant-numeric:tabular-nums}
.heat .c.deep{color:#fff}
.heat .c.sel{outline:3px solid var(--ink);outline-offset:-3px}
.hg{background:var(--h-green)} .hy{background:var(--h-yellow)} .ho{background:var(--h-orange)} .hr{background:var(--h-red)} .hd{background:var(--h-deep)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mod{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:14px;cursor:pointer}
.mod:hover{border-color:var(--accent)}
.mod b{font-size:1rem}
.mod span{color:var(--muted);font-size:.85rem}
.mod .yr{font-family:var(--font-mono);font-size:.72rem;color:var(--accent)}
.legendrow{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:.82rem;color:var(--muted);align-items:center}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.82rem;cursor:pointer;color:var(--ink)}
.toc button:hover{border-color:var(--accent);color:var(--accent)}
mark{background:var(--draft-soft);color:inherit;padding:0 2px;border-radius:2px}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px}
.hit small{color:var(--muted);font-size:.75rem}
.disclaimer{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;max-width:72ch}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}

  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(22px + env(safe-area-inset-top,0px));height:100%}

  h1{font-size:1.7rem}
}

const pill=(cls,t)=>`<span class="pill ${cls}">${t}</span>`;
function fld(id,label,attrs){return `<div class="f"><label for="${id}">${label}</label>${attrs}</div>`}
function inp(id,label,val,ph){return fld(id,label,`<input id="${id}" type="text" inputmode="decimal" value="${val??""}" placeholder="${ph??""}">`)}
function sel(id,label,opts,val){return fld(id,label,`<select id="${id}">${opts.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${v}"${v==val?" selected":""}>${t}</option>`}).join("")}</select>`)}
function chk(id,label,c){return `<label class="chk"><input type="checkbox" id="${id}"${c?" checked":""}><span>${label}</span></label>`}
const V=id=>{const e=document.getElementById(id);if(!e)return "";return e.type==="checkbox"?e.checked:e.value};

function gcat(e){return e>=90?"G1":e>=60?"G2":e>=45?"G3a":e>=30?"G3b":e>=15?"G4":"G5"}
function acat(a){return a<30?"A1":a<=300?"A2":"A3"}
const HEATC={G1:["hg","hy","ho"],G2:["hg","hy","ho"],G3a:["hy","ho","hr"],G3b:["ho","hr","hr"],G4:["hr","hr","hd"],G5:["hd","hd","hd"]};
const HEATN={G1:["1*","1","2"],G2:["1*","1","2"],G3a:["1","2","3"],G3b:["2","3","4+"],G4:["3","4+","4+"],G5:["4+","4+","4+"]};
const RISKTXT={hg:"Düşük risk",hy:"Orta artmış risk",ho:"Yüksek risk",hr:"Çok yüksek risk",hd:"Çok yüksek risk"};
function heatHTML(g,a){
 const rows=["G1","G2","G3a","G3b","G4","G5"],lbl={G1:"G1 ≥90",G2:"G2 60–89",G3a:"G3a 45–59",G3b:"G3b 30–44",G4:"G4 15–29",G5:"G5 <15"};
 let h=`<div class="tbl" tabindex="0" role="region" aria-label="Tablo" style="padding:8px"><div class="heat"><div class="hh">GFR \\ ACR</div><div class="hh">A1 &lt;30</div><div class="hh">A2 30–300</div><div class="hh">A3 &gt;300</div>`;
 rows.forEach(r=>{h+=`<div class="hh">${lbl[r]}</div>`;[0,1,2].forEach(i=>{const s=(r===g&&("A"+(i+1))===a)?" sel":"";h+=`<div class="c ${HEATC[r][i]}${HEATC[r][i]==="hd"?" deep":""}${s}" title="${RISKTXT[HEATC[r][i]]}">${HEATN[r][i]}</div>`})});
 h+=`</div></div><div class="legend"><span><i class="hg"></i>Düşük</span><span><i class="hy"></i>Orta artmış</span><span><i class="ho"></i>Yüksek</span><span><i class="hr"></i>Çok yüksek</span><span><i class="hd"></i>En yüksek</span><span>* KBH varsa</span></div>`;
 return h;
}
function egfrCr(scr,age,fem){const k=fem?0.7:0.9,a=fem?-0.241:-0.302,r=scr/k;return 142*Math.pow(Math.min(r,1),a)*Math.pow(Math.max(r,1),-1.2)*Math.pow(0.9938,age)*(fem?1.012:1)}
function egfrCys(cys,age,fem){const r=cys/0.8;return 133*Math.pow(Math.min(r,1),-0.499)*Math.pow(Math.max(r,1),-1.328)*Math.pow(0.996,age)*(fem?0.932:1)}
function egfrCrCys(scr,cys,age,fem){const k=fem?0.7:0.9,a=fem?-0.219:-0.144,r=scr/k,c=cys/0.8;return 135*Math.pow(Math.min(r,1),a)*Math.pow(Math.max(r,1),-0.544)*Math.pow(Math.min(c,1),-0.323)*Math.pow(Math.max(c,1),-0.778)*Math.pow(0.9961,age)*(fem?0.963:1)}
function kfre(age,male,egfr,acr,region){const s=-0.2201*(age/10-7.036)+0.2467*(male-0.5642)-0.5567*(egfr/5-7.222)+0.4510*(Math.log(acr)-5.137);const b=region==="na"?[0.9750,0.9240]:[0.9832,0.9365];const e=Math.exp(s);return [1-Math.pow(b[0],e),1-Math.pow(b[1],e)]}

const CALCS={
 egfr:{t:"eGFR ve evreleme",s:"CKD-EPI 2021 (ırksız) · 2012 sistatin C",
  f:()=>`<div class="fields">${sel("e_sex","Cinsiyet",[["f","Kadın"],["m","Erkek"]],"f")}${inp("e_age","Yaş (yıl)",62)}${inp("e_cr","Kreatinin (mg/dl)",1.4)}${inp("e_cys","Sistatin C (mg/l, ops.)","")}${inp("e_acr","UACR (mg/g, ops.)",120)}</div><div class="out" id="e_out"></div>`,
  run:()=>{const fem=V("e_sex")==="f",age=num(V("e_age")),cr=num(V("e_cr")),cy=num(V("e_cys")),acr=num(V("e_acr"));const o=$("#e_out");
   if(!(age>=18&&cr>0)){o.innerHTML=`<p class="msg dim">Yaş (≥18) ve kreatinin girin.</p>`;return}
   const a=egfrCr(cr,age,fem),b=cy>0?egfrCys(cy,age,fem):NaN,c=cy>0?egfrCrCys(cr,cy,age,fem):NaN;const use=isFinite(c)?c:a;const g=gcat(use),ac=acr>=0?acat(acr):null;
   let h=`<div class="big"><div><div class="v">${fmt(use)}</div><div class="u">ml/dk/1,73 m² · ${isFinite(c)?"eGFRcr-cys":"eGFRcr"}</div></div><div><div class="v">${g}${ac?" "+ac:""}</div><div class="u">GA kategorisi</div></div></div>`;
   h+=`<div class="kv"><div><small>eGFRcr</small><strong>${fmt(a)}</strong></div><div><small>eGFRcys</small><strong>${fmt(b)}</strong></div><div><small>eGFRcr-cys</small><strong>${fmt(c)}</strong></div>${isFinite(a)&&isFinite(b)?`<div><small>cys − cr farkı</small><strong>${fmt(b-a)}</strong></div>`:""}</div>`;
   if(ac){const i={A1:0,A2:1,A3:2}[ac];h+=`<p class="msg">${pill(HEATC[g][i]==="hg"?"ok":HEATC[g][i]==="hy"?"warn":"bad",RISKTXT[HEATC[g][i]])} GFR ve albüminüri izlemi yılda <b>${HEATN[g][i].replace("*","")}</b> kez önerilir.</p>`+heatHTML(g,ac)}
   if(isFinite(a)&&isFinite(b)&&Math.abs(b-a)/a>0.3)h+=`<p class="msg">${pill("warn","Uyumsuzluk")} eGFRcr ile eGFRcys arasında >%30 fark; kas kütlesi, diyet ve non-GFR belirleyicilerini gözden geçirin (UN 1.2.2.7).</p>`;
   h+=`<p class="msg dim">Kesin tanı için ≥3 ay süren anormallik gerekir. eGFR 18 yaş altında kullanılmaz.</p>`;o.innerHTML=h}},

 esa:{t:"ESA başlangıç dozu ve ESA direnç indeksi",s:"KDIGO 2026 Tablo 7",
  f:()=>`<div class="fields">${inp("s_w","Kuru ağırlık (kg)",68)}${inp("s_hb","Hb (g/dl)",9.4)}${sel("s_m","Modalite",[["nd","Diyaliz dışı / PD / nakil"],["hd","Hemodiyaliz (G5D)"]],"hd")}${inp("s_wk","Haftalık epoetin dozu (U, ERI için)",6000)}</div><div class="out" id="s2_out"></div>`,
  run:()=>{const w=num(V("s_w")),hb=num(V("s_hb")),m=V("s_m"),wk=num(V("s_wk")),o=$("#s2_out");if(!(w>0)){o.innerHTML=`<p class="msg dim">Ağırlık girin.</p>`;return}

   else rows=[["Epoetin alfa/beta",`~${r(50*w)} U haftada 1–2 (veya ${r(100*w)} U 2 haftada bir)`],["Darbepoetin alfa",`${fmt(0.45*w,0)} µg haftalık veya 40–100 µg 2–4 haftada bir`],["Metoksi PEG-epoetin beta",`${fmt(0.6*w,0)} µg 2 haftada bir veya ${fmt(1.5*w,0)} µg ayda bir`]];
   let h="";if(hb>0){if(m==="hd")h+=hb<=10?`<p class="msg">${pill("ok","Başlama eşiği")} G5D’de Hb ≤9,0–10,0 g/dl (3.2.1, 2D).</p>`:`<p class="msg">${pill("info","Eşik üstü")} Hb &gt;10 g/dl; G5D başlama eşiği karşılanmıyor.</p>`;else h+=`<p class="msg">${pill("info","Bireysel")} Diyaliz dışı/nakilde başlama eşiği semptoma göre seçilir; çoğunlukla 8,5–10,0 g/dl.</p>`;
    if(hb>=11.5)h+=`<p class="msg">${pill("bad","Üst sınır")} ESA alan erişkinde Hb hedefi &lt;11,5 g/dl (3.3.1, 1D).</p>`}
   h+=`<div class="tbl" tabindex="0" role="region" aria-label="Tablo"><table><thead><tr><th>ESA</th><th>Hesaplanan başlangıç</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x[0]}</td><td class="n">${x[1]}</td></tr>`).join("")}</tbody></table></div>`;

   h+=`<p class="msg dim">Dozu 4 haftada bir defadan sık değiştirmeyin; 2–4 haftada Hb &gt;1 g/dl artarsa %25–50 azaltın.</p>`;o.innerHTML=h}},
 mkbmon:{t:"KBH-MKB izlem planı",s:"KDIGO 2017 3.1.2",

 pth:{t:"G5D’de PTH hedef aralığı",s:"KDIGO 2017 4.2.3",

   const lo=2*u,hi=9*u;let h=`<div class="big"><div><div class="v">${fmt(lo)}–${fmt(hi)}</div><div class="u">pg/ml (2–9 × ULN)</div></div>${v>0?`<div><div class="v">${fmt(v/u,1)}×</div><div class="u">ULN</div></div>`:""}</div>`;

 protein:{t:"Protein ve sodyum hedefi",s:"KBH 2024 3.3",
  f:()=>`<div class="fields">${inp("q_w","Vücut ağırlığı (kg)",72)}${sel("q_g","Evre",[["g12","G1–G2"],["g35","G3–G5 (diyaliz dışı)"]],"g35")}</div><div class="chks">${chk("q_vlp","Çok düşük proteinli diyet + ketoanalog düşünülüyor (istekli, yakın izlem)")}${chk("q_uns","Metabolik olarak stabil değil")}${chk("q_old","Yaşlı, kırılganlık veya sarkopeni")}</div><div class="out" id="q_out"></div>`,

   else if(V("q_g")==="g35"&&V("q_vlp"))h=`<div class="big"><div><div class="v">${fmt(0.3*w)}–${fmt(0.4*w)} g</div><div class="u">protein/gün (0,3–0,4 g/kg)</div></div><div><div class="v">≤${fmt(0.6*w)} g</div><div class="u">+ EAA/ketoanalog dahil toplam</div></div></div>`;

   else h=`<div class="big"><div><div class="v">&lt;${fmt(1.3*w)} g</div><div class="u">progresyon riski varsa üst sınır</div></div></div>`;
   if(V("q_old"))h+=`<p class="msg">${pill("info","Yaşlı/kırılgan")} Daha yüksek protein ve enerji hedefleri düşünün (UN 3.3.1.5).</p>`;
   h+=`<p class="msg">Sodyum &lt;2 g/gün (&lt;90 mmol; &lt;5 g tuz). Tuz kaybettiren nefropatide kısıtlama uygun değildir.</p><p class="msg dim">Bireysel plan böbrek diyetisyeniyle yapılmalıdır.</p>`;o.innerHTML=h}},
 kalgo:{t:"Hiperkalemi yönetim yardımcısı",s:"KBH 2024 Şekil 25 · Tablo 28",
  f:()=>`<div class="fields">${inp("h_k","Serum K⁺ (mmol/l)",5.8)}</div><div class="chks">${chk("h_un","Klinik olarak kötü veya AKİ var")}${chk("h_ras","RASi veya MRA kullanıyor",true)}</div><div class="out" id="h_out"></div>`,
  run:()=>{const k=num(V("h_k")),o=$("#h_out");if(!(k>0)){o.innerHTML=`<p class="msg dim">Potasyum girin.</p>`;return}let h;
   if(k>=6.5)h=`${pill("bad","Ağır")} Acil değerlendirme ve tedavi; tekrar kan testi ve sürekli EKG monitörü.`;
   else if(k>=6.0)h=V("h_un")?`${pill("bad","Orta")} Hastanede değerlendirip tedavi edin.`:`${pill("warn","Orta")} Beklenmeyen sonuçsa 24 saat içinde tekrarlayın.`;
   else if(k>5.5)h=`${pill("warn","&gt;5,5")} 1) NSAİİ, trimetoprim gibi ilaçları ve diyet potasyumunu gözden geçirin. 2) Diüretik, bikarbonat düzeltmesi, patiromer veya SZC. 3) Son çare olarak RASi/MRA dozunu azaltın veya kesin.`;
   else h=`${pill("ok","≤5,5")} Hiperkalemi eşiğinin altında; finerenon için K⁺ 4,9–5,5’te devam, 4 ayda bir izlem.`;
   o.innerHTML=`<p class="msg">${h}</p>${V("h_ras")&&k>5.5&&k<6.5?`<p class="msg dim">RASi/MRA kesmek KV olayları artırır; durum düzelince yeniden başlayın.</p>`:""}`}},
 mayo:{t:"Mayo görüntüleme sınıfı (htTKV)",s:"KDIGO 2025 Öneri 1.4.2.1",
  f:()=>`<div class="fields">${inp("y_age","Yaş",38)}${inp("y_h","Boy (cm)",172)}${inp("y_rl","Sağ böbrek uzunluk (cm)",17)}${inp("y_rw","Sağ genişlik (cm)",9)}${inp("y_rd","Sağ derinlik (cm)",8.5)}${inp("y_ll","Sol uzunluk (cm)",18)}${inp("y_lw","Sol genişlik (cm)",9.5)}${inp("y_ld","Sol derinlik (cm)",9)}${inp("y_tkv","veya ölçülmüş TKV (ml)","")}</div><div class="out" id="y_out"></div>`,
  run:()=>{const age=num(V("y_age")),hm=num(V("y_h"))/100,o=$("#y_out");let tkv=num(V("y_tkv"));
   if(!(tkv>0)){const r=Math.PI/6*num(V("y_rl"))*num(V("y_rw"))*num(V("y_rd")),l=Math.PI/6*num(V("y_ll"))*num(V("y_lw"))*num(V("y_ld"));tkv=r+l}
   if(!(age>0&&hm>0&&tkv>0)){o.innerHTML=`<p class="msg dim">Yaş, boy ve böbrek boyutlarını (veya TKV) girin.</p>`;return}
   const ht=tkv/hm,g=Math.pow(ht/150,1/age)-1,gp=g*100;const cls=gp<1.5?"1A":gp<3?"1B":gp<4.5?"1C":gp<6?"1D":"1E";const fast=["1C","1D","1E"].includes(cls);
   o.innerHTML=`<div class="big"><div><div class="v">${fmt(tkv)}</div><div class="u">TKV (ml)</div></div><div><div class="v">${fmt(ht)}</div><div class="u">htTKV (ml/m)</div></div><div><div class="v">${cls}</div><div class="u">Mayo sınıfı · tahmini artış %${fmt(gp,1)}/yıl</div></div></div>
   <p class="msg">${fast?pill("bad","Hızlı ilerleme riski"):pill("ok","Yavaş ilerleme")} ${fast?"Mayo 1C–1E: eGFR ≥25 ise tolvaptan endikasyonu açısından değerlendirin (Öneri 4.1.1.1). 1B sınırındaki 1C olgularında bireysel değerlendirme gerekir.":"Tolvaptan için Mayo ölçütü karşılanmıyor; eGFR düşüş hızını ayrıca değerlendirin."}</p>
   ${age<15||age>80?`<p class="msg">${pill("warn","Geçerlilik")} Sınıflama 15–80 yaş için tanımlanmıştır.</p>`:""}<p class="msg dim">Elipsoid TKV = π/6 × uzunluk × genişlik × derinlik (her böbrek). Atipik tutulumda (sınıf 2A/2B) ve minör genlerde kullanılmaz. Büyüme oranı doğumda 150 ml/m varsayımıyla hesaplanır.</p>`}},
 propkd:{t:"PROPKD skoru",s:"KDIGO 2025 Şekil 12",
  f:()=>`<div class="fields">${sel("pk_s","Cinsiyet",[["0","Kadın (0)"],["1","Erkek (1)"]],"1")}${sel("pk_g","Genetik varyant",[["0","PKD2 (0)"],["2","PKD1 kesmeyen (2)"],["4","PKD1 kesen (4)"],["x","Bilinmiyor"]],"4")}</div><div class="chks">${chk("pk_h","35 yaş öncesi hipertansiyon (2)")}${chk("pk_u","35 yaş öncesi ürolojik olay: makroskopik hematüri, kist enfeksiyonu, kist ağrısı (2)")}</div><div class="out" id="pk_out"></div>`,

   $("#pk_out").innerHTML=`<div class="big"><div><div class="v">${s}</div><div class="u">puan (0–9)</div></div></div><p class="msg">${pill(c[0],c[1])} ${c[2]}</p>${g==="x"?`<p class="msg dim">Varyant bilinmeden skor eksik hesaplanır.</p>`:""}`}},
 tolv:{t:"Tolvaptan uygunluğu",s:"KDIGO 2025 Şekil 25",
  f:()=>`<div class="fields">${inp("v_age","Yaş",40)}${inp("v_e","eGFR",58)}${sel("v_mayo","Mayo sınıfı",[["","Bilinmiyor"],["1A","1A"],["1B","1B"],["1C","1C"],["1D","1D"],["1E","1E"],["2","2A/2B (atipik)"]],"1D")}${inp("v_sl","eGFR düşüşü (ml/dk/1,73 m²/yıl)",2)}</div><div class="chks">${chk("v_pp","PROPKD >6")}${chk("v_ci","Mutlak kontrendikasyon var (gebelik/emzirme, hipovolemi riski, susama algısı yok, hipernatremi, obstrüksiyon, güçlü CYP3A inhibitörü, belirgin karaciğer hastalığı)")}${chk("v_alt","eGFR düşüşünü açıklayan başka neden var (vasküler, kontrolsüz KB, diyabetik nefropati, proteinüri ≥1 g/gün, AKİ)")}</div><div class="out" id="v_out"></div>`,
  run:()=>{const e=num(V("v_e")),m=V("v_mayo"),sl=num(V("v_sl")),o=$("#v_out");if(!(e>0)){o.innerHTML=`<p class="msg dim">eGFR girin.</p>`;return}

   else if(V("v_pp"))h=`${pill("warn","Değerlendirin")} Mayo/eGFR eğimi belirsiz; PROPKD &gt;6 hızlı ilerleme için ek kanıttır (UN 4.1.1.3).`;
   else h=`${pill("info","Ölçüt yok")} Hızlı ilerleme ölçütü karşılanmıyor.`;
   if(m==="2")h+=`<br>${pill("warn","Atipik")} Sınıf 2’de Mayo prognozu uygulanmaz.`;
   if(V("v_alt"))h+=`<br>${pill("warn","Alternatif neden")} Başlamadan önce yeniden değerlendirin; gerekirse MR/BT ve aile öyküsü ile ADPKD’yi ana neden olarak doğrulayın.`;
   o.innerHTML=`<p class="msg">${h}</p><p class="msg dim">Doz: 45/15 mg → 60/30 → hedef 90/30 mg (haftalık titrasyon). KC testleri ilk 18 ay aylık, sonra 3 ayda bir.</p>`}},
 cancer:{t:"Kanser sonrası nakil bekleme süresi",s:"KDIGO 2020 Tablo 14",

/* Arama */
function flatten(){const out=[];MODS.forEach(m=>m.secs.forEach((s,si)=>s.items.forEach(it=>{let t="",no="";if(["R","DR"].includes(it[0])){no=it[1];t=it[3]}else if(["P","NG","DP"].includes(it[0])){no=it[1];t=it[2]}else if(["X","N","W","H"].includes(it[0]))t=it[1];else if(it[0]==="L")t=it[1].join(" ");else if(it[0]==="T")t=it[2].map(r=>r.join(" ")).join(" · ");else if(it[0]==="C"){t=CALCS[it[1]].t+" hesaplayıcı"}if(t)out.push({m,si,s,no,t,k:it[0]})})));return out}
let FLAT=null;
const fold=s=>s.toLocaleLowerCase("tr-TR").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ı/g,"i");
function viewSearch(q){
 FLAT=FLAT||flatten();const f=fold(q),terms=f.split(/\s+/).filter(Boolean);
 const hits=FLAT.filter(x=>{const h=fold(x.t+" "+x.s.h+" "+x.m.nav+" "+x.no);return terms.every(t=>h.includes(t))}).slice(0,80);
 const hl=t=>{let s=esc(t);terms.forEach(tm=>{if(tm.length<2)return;const re=new RegExp("("+tm.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");s=s.replace(re,"<mark>$1</mark>")});return s};
 return `<div><div class="eyebrow">Arama</div><h1>“${esc(q)}”</h1><p class="lede">${hits.length} sonuç${hits.length===80?" (ilk 80)":""}</p></div>${hits.map(x=>`<button class="hit" data-go="${x.m.id}" data-sec="s${x.si}"><small>${x.m.nav} › ${esc(x.s.h)}${x.no?" · "+esc(x.no):""}</small><span>${hl(x.t.length>260?x.t.slice(0,260)+"…":x.t)}</span></button>`).join("")||`<p class="txt">Sonuç yok. Farklı bir terim deneyin (örn. “ferritin”, “Mayo”, “gadolinyum”).</p>`}`;
}

/* Router */
let current="home";
function go(id,sec,push=true){
 const v=$("#view");current=id;let html;
 const m=MODS.find(x=>x.id===id);
 if(id==="hesap")html=viewCalc();else if(id==="kaynak")html=viewSrc();else if(m)html=viewMod(m);else{current="home";html=viewHome()}
 v.innerHTML=html;bindCalcs(v);$("#navlist").innerHTML=navHTML(current);
 if(push){try{history.replaceState(null,"",current==="home"?location.pathname+location.search:"#"+current)}catch(e){}}
 $("#side").classList.remove("open");
 if(sec){const t=document.getElementById(sec);if(t)setTimeout(()=>t.scrollIntoView({block:"start"}),0)}else window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-go],[data-sec]");if(!b)return;
 if(b.dataset.go){$("#q").value="";go(b.dataset.go,b.dataset.sec)}
 else if(b.dataset.sec){const t=document.getElementById(b.dataset.sec);if(t)t.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
});
let qt;$("#q").addEventListener("input",e=>{clearTimeout(qt);const q=e.target.value.trim();qt=setTimeout(()=>{if(q.length<2){go(current==="search"?"home":current);return}const v=$("#view");v.innerHTML=viewSearch(q);window.scrollTo(0,0)},180)});
$("#menuBtn").addEventListener("click",()=>$("#side").classList.toggle("open"));
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#side").classList.remove("open")});
/* Tema */
const THEMES=["system","light","dark"],TN={system:"Sistem",light:"Açık",dark:"Koyu"};
function applyTheme(t){if(t==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t);$("#themeBtn").textContent="Tema: "+TN[t]}
let theme="system";try{theme=localStorage.getItem("kbh-theme")||"system"}catch(e){}
applyTheme(theme);
$("#themeBtn").addEventListener("click",()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%3];applyTheme(theme);try{localStorage.setItem("kbh-theme",theme)}catch(e){}});
/* Başlat */
const h0=(location.hash||"").replace("#","");go(h0||"home",null,false);
/* Çevrimdışı: GitHub Pages gibi bir sunucuda service worker kaydı; artifact çerçevesinde sessizce atlanır */
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>

<script>(()=>{const a=document.getElementById('q2'),b=document.getElementById('q');if(!a||!b)return;a.addEventListener('input',()=>{b.value=a.value;b.dispatchEvent(new Event('input',{bubbles:true}))});b.addEventListener('input',()=>{if(document.activeElement!==a)a.value=b.value});document.addEventListener('click',e=>{if(e.target.closest('[data-go]'))a.value=''});})();</script>
